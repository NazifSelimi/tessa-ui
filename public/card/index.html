<style>
:root{--wine:#733a49;--wine-d:#5a2c39;--ink:#242124;--cream:#fffdf9;--sand:#efe6da;--gold:#c9a96e;--muted:#6f6468}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:28px 16px;background:radial-gradient(circle at 30% 20%,#f8f1e8,var(--sand));font-family:"DM Sans",system-ui,sans-serif;color:var(--ink)}
.scene{width:100%;max-width:520px;aspect-ratio:85/55;perspective:1400px;cursor:pointer}
.flip{position:relative;width:100%;height:100%;transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.scene.back .flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 2px 4px rgba(0,0,0,.08),0 24px 50px rgba(90,44,57,.28)}
.front{background:linear-gradient(135deg,var(--wine),var(--wine-d));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center}
.front::after{content:"";position:absolute;inset:12px;border:1px solid rgba(201,169,110,.55);border-radius:10px}
.front svg.logo{width:52%;height:auto;color:#fff}
.front .tag{margin-top:10px;font-size:clamp(10px,2.4vw,13px);letter-spacing:.45em;text-transform:uppercase;color:var(--gold)}
.backf{transform:rotateY(180deg);background:var(--cream);display:grid;grid-template-columns:1fr auto;align-items:center;gap:4%;padding:7% 7%}
.backf::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--wine)}
h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:clamp(20px,5.6vw,32px);line-height:1.05}
.role{margin-top:4px;font-size:clamp(11px,2.6vw,14px);font-weight:600;color:var(--wine);letter-spacing:.06em;text-transform:uppercase}
.role-mk{font-size:clamp(9px,2.2vw,12px);color:var(--muted)}
.rule{width:36px;height:2px;background:var(--gold);margin:clamp(8px,2.4vw,14px) 0}
.c{display:flex;align-items:center;gap:7px;font-size:clamp(10px,2.6vw,14px);color:var(--ink);text-decoration:none;margin-top:4px}
.c svg{width:1.1em;height:1.1em;color:var(--wine);flex:none}
.qr{width:clamp(70px,22vw,120px);padding:6px;background:#fff;border-radius:8px;border:1px solid #eadfd8}
.qr svg{display:block;width:100%;height:auto}
.mini{position:absolute;right:7%;bottom:6%;width:14%;color:var(--wine);opacity:.9}
.hint{font-size:13px;color:var(--muted)}
.actions{display:flex;gap:10px;width:100%;max-width:520px}
.actions a,.actions button{flex:1;padding:14px;border-radius:12px;border:0;font:600 15px "DM Sans",sans-serif;text-align:center;text-decoration:none;cursor:pointer}
.save{background:var(--ink);color:#fff}
.save:hover{background:var(--wine)}
.share{background:#fff;color:var(--ink);border:1px solid #e2d6cc !important}
@media (prefers-reduced-motion:reduce){.flip{transition:none}}
</style>
</head>

<script>
var card=document.getElementById('card');
function flip(){card.classList.toggle('back')}
card.addEventListener('click',flip);
card.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();flip()}});
setTimeout(function(){if(!card.dataset.t){card.classList.add('back')}},1200);
card.addEventListener('click',function(){card.dataset.t=1},{once:true});
document.getElementById('share').addEventListener('click',function(){
  var url='https://tessa.mk/card',b=this;
  if(navigator.share){navigator.share({title:'Safija Selimi · TESSA',url:url}).catch(function(){});return}
  try{navigator.clipboard.writeText(url).then(function(){b.textContent='Link copied';setTimeout(function(){b.textContent='Share card'},1800)})}catch(e){}
});
</script>
